<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08030e" />
      <stop offset="100%" stop-color="#030206" />
    </linearGradient>

    <filter id="barGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes barPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #FF0033); }
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="300" rx="14" fill="url(#cardBg)" stroke="#261033" stroke-width="1.5" />

  <!-- Grid Header HUD -->
  <g transform="translate(25, 24)">
    <!-- Akatsuki Cloud Micro Icon -->
    <g transform="translate(0, 4) scale(0.3)">
      <path d="M-10,0 C-15,-6 -8,-14 0,-10 C4,-16 16,-12 16,-4 C22,-2 22,6 14,8 C10,12 -2,12 -6,6 C-12,8 -16,4 -10,0 Z" fill="#FF0033" stroke="#FFFFFF" stroke-width="1.5" />
    </g>
    <text x="22" y="8" font-family="'Fira Code', 'Courier New', monospace" font-size="12" font-weight="bold" fill="#FF0033" letter-spacing="1.5">
      // SIX PATHS OCULAR ARSENAL • SHINOBI PROFICIENCIES
    </text>
    <text x="850" text-anchor="end" y="8" font-family="'Fira Code', monospace" font-size="10" fill="#A855F7" letter-spacing="1">
      SPECIALIZATION: RED TEAM / DEV
    </text>
    <line x1="0" y1="18" x2="850" y2="18" stroke="#251033" stroke-width="1" />
  </g>

