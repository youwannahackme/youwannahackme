    <line x1="14" y1="32" x2="188" y2="32" stroke="#261033" />

    <!-- Go -->
    <g transform="translate(14, 52)" font-family="'Fira Code', monospace" font-size="10.5">
      <text fill="#CBD5E1">Go (Golang)</text>
      <text x="174" text-anchor="end" fill="#FF0033" font-weight="bold">95%</text>
      <rect y="7" width="174" height="5" rx="2.5" fill="#200d2b" />
      <rect y="7" width="165" height="5" rx="2.5" fill="#FF0033" filter="url(#barGlow)" />
