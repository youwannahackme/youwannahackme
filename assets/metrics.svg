<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 185" width="900" height="185">
  <defs>
    <linearGradient id="mCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0413" />
      <stop offset="100%" stop-color="#040208" />
    </linearGradient>

    <filter id="mGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="900" height="185" rx="12" fill="url(#mCardBg)" stroke="#251033" stroke-width="1.5" />

  <!-- LEFT COLUMN: Shinobi Telemetry -->
  <g transform="translate(25, 20)">
    <!-- Header with Uchiha Fan Crest Micro -->
    <g transform="translate(0, 4) scale(0.35)">
      <!-- Uchiha Fan: Top red, bottom white, white handle -->
      <path d="M 0,0 A 10 10 0 0 1 20,0 A 10 10 0 0 0 0,0 Z" fill="#FF0033" />
      <path d="M 0,0 A 10 10 0 0 0 20,0 A 10 10 0 0 1 0,0 Z" fill="#FFFFFF" />
      <rect x="8.5" y="0" width="3" height="8" fill="#FFFFFF" />
    </g>
    <text x="18" y="10" font-family="'Fira Code', 'Courier New', monospace" font-size="12" font-weight="bold" fill="#FF0033" letter-spacing="1.5">
      &gt; SHINOBI TELEMETRY &amp; OPERATIONAL VELOCITY
    </text>
    <line x1="0" y1="18" x2="400" y2="18" stroke="#261033" stroke-width="1" />

    <!-- Metric 1: Offensive Engines -->
    <g transform="translate(0, 42)">
      <circle cx="6" cy="6" r="3" fill="#FF0033" />
      <text x="18" y="10" font-family="'Fira Code', monospace" font-size="11" fill="#CBD5E1">Weaponized Tooling Engines</text>
      <text x="390" text-anchor="end" y="10" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#FF0033">6 Published</text>
    </g>

    <!-- Metric 2: Security Focus -->
    <g transform="translate(0, 72)">
      <circle cx="6" cy="6" r="3" fill="#A855F7" />
      <text x="18" y="10" font-family="'Fira Code', monospace" font-size="11" fill="#CBD5E1">Security Specialization</text>
      <text x="390" text-anchor="end" y="10" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#C084FC">Recon &amp; Bug Bounty</text>
    </g>

    <!-- Metric 3: Training Labs -->
    <g transform="translate(0, 102)">
      <circle cx="6" cy="6" r="3" fill="#38BDF8" />
      <text x="18" y="10" font-family="'Fira Code', monospace" font-size="11" fill="#CBD5E1">Training Laboratories</text>
      <text x="390" text-anchor="end" y="10" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#38BDF8">PortSwigger + HTB</text>
    </g>

    <!-- Metric 4: Target Role -->
    <g transform="translate(0, 132)">
      <circle cx="6" cy="6" r="3" fill="#FF4D6D" />
      <text x="18" y="10" font-family="'Fira Code', monospace" font-size="11" fill="#CBD5E1">Target Career Role</text>
      <text x="390" text-anchor="end" y="10" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#FF4D6D">Penetration Testing</text>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="450" y1="20" x2="450" y2="165" stroke="#261033" stroke-width="1" />

  <!-- RIGHT COLUMN: Chakra Allocation (Languages) -->
  <g transform="translate(475, 20)">
    <!-- Header -->
    <text y="10" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" fill="#C084FC" letter-spacing="1.5">
      &gt; CHAKRA ALLOCATION // WEAPONIZED CODEBASE
    </text>
    <line x1="0" y1="18" x2="400" y2="18" stroke="#261033" stroke-width="1" />

    <!-- Language 1: Go -->
    <g transform="translate(0, 42)">
      <text y="10" font-family="'Fira Code', monospace" font-size="11" fill="#CBD5E1">Go (Engines &amp; Concurrency)</text>
      <text x="400" text-anchor="end" y="10" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#00ADD8">58.4%</text>
      <rect y="16" width="400" height="5" rx="2.5" fill="#200d2b" />
      <rect y="16" width="234" height="5" rx="2.5" fill="#00ADD8" />
    </g>

    <!-- Language 2: Python -->
    <g transform="translate(0, 72)">
      <text y="10" font-family="'Fira Code', monospace" font-size="11" fill="#CBD5E1">Python (Exploit Scripting)</text>
      <text x="400" text-anchor="end" y="10" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#FFD43B">26.1%</text>
      <rect y="16" width="400" height="5" rx="2.5" fill="#200d2b" />
      <rect y="16" width="104" height="5" rx="2.5" fill="#FFD43B" />
    </g>

    <!-- Language 3: JavaScript -->
    <g transform="translate(0, 102)">
      <text y="10" font-family="'Fira Code', monospace" font-size="11" fill="#CBD5E1">JavaScript (Chrome Extensions)</text>
      <text x="400" text-anchor="end" y="10" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#F7DF1E">10.8%</text>
      <rect y="16" width="400" height="5" rx="2.5" fill="#200d2b" />
      <rect y="16" width="43" height="5" rx="2.5" fill="#F7DF1E" />
    </g>

    <!-- Language 4: Shell -->
    <g transform="translate(0, 132)">
      <text y="10" font-family="'Fira Code', monospace" font-size="11" fill="#CBD5E1">Shell / Bash (Automations)</text>
      <text x="400" text-anchor="end" y="10" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#38BDF8">4.7%</text>
      <rect y="16" width="400" height="5" rx="2.5" fill="#200d2b" />
      <rect y="16" width="19" height="5" rx="2.5" fill="#38BDF8" />
    </g>
  </g>
</svg>