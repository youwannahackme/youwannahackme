    <text x="210" y="10" font-family="'Fira Code', monospace" font-size="11.5" fill="#F1F5F9">github.com/youwannahackme</text>
    <text x="832" text-anchor="end" y="10" font-family="'Fira Code', monospace" font-size="10" fill="#64748B">[6 WEAPONIZED REPOSITORIES]</text>
