<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 175" width="100%" height="100%">
  <defs>
    <linearGradient id="cCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1b" />
      <stop offset="100%" stop-color="#03060c" />
    </linearGradient>

    <linearGradient id="cBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.8" />
    </linearGradient>

    <filter id="cGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px #00FF9C); }
    }
    .c-label {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #00FF9C;
      letter-spacing: 1px;
    }
    .c-val {
      font-family: 'Fira Code', monospace;
      font-size: 11.5px;
      fill: #E2E8F0;
    }
    .c-sub {
      font-family: 'Fira Code', monospace;
      font-size: 10px;
      fill: #94A3B8;
    }
  </style>

  <!-- Outer Card Frame (Increased height for generous bottom padding) -->
  <rect width="880" height="175" rx="12" fill="url(#cCardBg)" stroke="url(#cBorderGrad)" stroke-width="1.3" />

  <!-- Top Header Bar -->
  <g transform="translate(24, 24)">
    <circle cx="6" cy="6" r="3.5" fill="#00FF9C" style="animation: pulseDot 2s infinite;" />
    <text x="18" y="10" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#00FF9C" letter-spacing="1.5">
      // ENCRYPTED DISPATCH &amp; COLLABORATION PROTOCOL
    </text>
    <text x="832" text-anchor="end" y="10" class="c-sub" fill="#00F0FF">STATUS: OPEN FOR WORK &amp; RESEARCH</text>
    <line x1="0" y1="18" x2="832" y2="18" stroke="#16233b" stroke-width="1" />
  </g>

  <!-- Content Rows (Evenly spaced with 25px bottom margin) -->
  <g transform="translate(24, 58)">
    <!-- Row 1: Email -->
    <g transform="translate(0, 0)">
      <rect width="90" height="24" rx="4" fill="#0a1526" stroke="#00FF9C" stroke-width="0.8" stroke-opacity="0.4" />
      <text x="45" y="16" text-anchor="middle" class="c-label">EMAIL</text>
      <text x="105" y="16" class="c-val">arshadshoaib029@gmail.com</text>
      <text x="832" text-anchor="end" y="16" class="c-sub">PGP / Direct Inquiries</text>
    </g>

    <!-- Row 2: LinkedIn -->
    <g transform="translate(0, 32)">
      <rect width="90" height="24" rx="4" fill="#0a1526" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.4" />
      <text x="45" y="16" text-anchor="middle" class="c-label" fill="#00F0FF">LINKEDIN</text>
      <text x="105" y="16" class="c-val">linkedin.com/in/shoaib-arshad-580681408</text>
      <text x="832" text-anchor="end" y="16" class="c-sub">Professional Network</text>
    </g>

    <!-- Row 3: GitHub -->
    <g transform="translate(0, 64)">
      <rect width="90" height="24" rx="4" fill="#0a1526" stroke="#7000FF" stroke-width="0.8" stroke-opacity="0.5" />
      <text x="45" y="16" text-anchor="middle" class="c-label" fill="#D8B4FE">GITHUB</text>
      <text x="105" y="16" class="c-val">github.com/youwannahackme</text>
      <text x="832" text-anchor="end" y="16" class="c-sub">Security Repositories</text>
    </g>
  </g>
</svg>
