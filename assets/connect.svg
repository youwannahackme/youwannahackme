<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 175" width="880" height="175">
  <defs>
    <linearGradient id="cCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0414" />
      <stop offset="100%" stop-color="#040208" />
    </linearGradient>

    <linearGradient id="cBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0033" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF0033" stop-opacity="0.8" />
    </linearGradient>

    <filter id="cGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #FF0033); }
    }
  </style>

  <!-- Outer Card Frame -->
  <rect width="880" height="175" rx="12" fill="url(#cCardBg)" stroke="url(#cBorderGrad)" stroke-width="1.3" />

  <!-- Top Header Bar -->
  <g transform="translate(24, 24)">
    <circle cx="6" cy="6" r="3.5" fill="#FF0033" style="animation: pulseDot 2s infinite;" />
    <text x="18" y="10" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="bold" fill="#FF0033" letter-spacing="1.5">
      // KAMUI SPACE-TIME TRANSMISSION • AKATSUKI DISPATCH CHANNEL
    </text>
    <text x="832" text-anchor="end" y="10" font-family="'Fira Code', monospace" font-size="10" fill="#C084FC">STATUS: OPEN FOR RESEARCH &amp; RED TEAM</text>
    <line x1="0" y1="18" x2="832" y2="18" stroke="#261033" stroke-width="1" />
  </g>

  <!-- Row 1: Email -->
  <g transform="translate(24, 62)">
    <circle cx="6" cy="6" r="3" fill="#FF0033" />
    <text x="18" y="10" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#FF4D6D" letter-spacing="1">ENCRYPTED DISPATCH:</text>
    <text x="210" y="10" font-family="'Fira Code', monospace" font-size="11.5" fill="#F1F5F9">arshadshoaib029@gmail.com</text>
    <text x="832" text-anchor="end" y="10" font-family="'Fira Code', monospace" font-size="10" fill="#64748B">[DIRECT COMMS • PGP ARMED]</text>
  </g>

