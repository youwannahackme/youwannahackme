    <text x="18" y="10" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#38BDF8" letter-spacing="1">OPERATOR NETWORK:</text>
    <text x="210" y="10" font-family="'Fira Code', monospace" font-size="11.5" fill="#F1F5F9">linkedin.com/in/shoaib-arshad-580681408</text>
    <text x="832" text-anchor="end" y="10" font-family="'Fira Code', monospace" font-size="10" fill="#64748B">[PROFESSIONAL PROFILE]</text>
  </g>

  <!-- Row 3: GitHub -->
  <g transform="translate(24, 130)">
    <circle cx="6" cy="6" r="3" fill="#C084FC" />
