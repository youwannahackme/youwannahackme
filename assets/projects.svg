    <rect width="275" height="185" rx="10" fill="url(#pCardBg)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.5" />
    
    <text x="16" y="28" font-family="'Fira Code', monospace" font-size="15" font-weight="bold" fill="#38BDF8">🎯 Vulncat</text>
    <rect x="212" y="14" width="46" height="18" rx="4" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="0.8" />
    <text x="235" y="27" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#38BDF8">Go</text>

    <text x="16" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#CBD5E1">
      <tspan x="16" dy="0">Vulnerability-surface URL classifier</tspan>
      <tspan x="16" dy="17">for bug bounty recon. Replaces flat</tspan>
      <tspan x="16" dy="17">regex with multi-signal heuristics,</tspan>
      <tspan x="16" dy="17">value-shapes &amp; REST context.</tspan>
    </text>

    <g transform="translate(16, 132)">
      <rect width="243" height="38" rx="5" fill="#150824" stroke="#2b1242" stroke-width="0.8" />
      <text x="10" y="16" font-family="'Fira Code', monospace" font-size="9.5" fill="#94A3B8">CORE: <tspan fill="#38BDF8">Heuristic Shape Engine</tspan></text>
      <text x="10" y="30" font-family="'Fira Code', monospace" font-size="9.5" fill="#94A3B8">STATUS: <tspan fill="#38BDF8" font-weight="bold">Attack Surface Triaged</tspan></text>
    </g>
  </g>

  <!-- ================= ROW 2 ================= -->
  <!-- CARD 4: RefleX -->
  <g transform="translate(25, 252)">
    <rect width="275" height="185" rx="10" fill="url(#pCardBg)" stroke="#FF0033" stroke-width="1.2" stroke-opacity="0.5" />
    
    <text x="16" y="28" font-family="'Fira Code', monospace" font-size="15" font-weight="bold" fill="#FF4D6D">🔥 RefleX</text>
    <rect x="194" y="14" width="64" height="18" rx="4" fill="#FF0033" fill-opacity="0.2" stroke="#FF0033" stroke-width="0.8" />
