      <text x="10" y="16" font-family="'Fira Code', monospace" font-size="9.5" fill="#94A3B8">CORE: <tspan fill="#FF4D6D">Concurrent • Contextual</tspan></text>
      <text x="10" y="30" font-family="'Fira Code', monospace" font-size="9.5" fill="#94A3B8">STATUS: <tspan fill="#FF0033" font-weight="bold">Severity Evaluated</tspan></text>
    </g>
  </g>

  <!-- CARD 5: CVE Hunter Pro -->
  <g transform="translate(322, 252)">
    <rect width="275" height="185" rx="10" fill="url(#pCardBg)" stroke="#FBBF24" stroke-width="1.2" stroke-opacity="0.5" />
    
    <text x="16" y="28" font-family="'Fira Code', monospace" font-size="15" font-weight="bold" fill="#FBBF24">🛡️ CVE Hunter</text>
    <rect x="212" y="14" width="46" height="18" rx="4" fill="#D97706" fill-opacity="0.2" stroke="#FBBF24" stroke-width="0.8" />
    <text x="235" y="27" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#FBBF24">JS</text>

    <text x="16" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#CBD5E1">
      <tspan x="16" dy="0">Chrome extension for single-lookup</tspan>
      <tspan x="16" dy="17">CVE triage: CVSS base scores, EPSS</tspan>
      <tspan x="16" dy="17">exploit probability, CISA KEV</tspan>
      <tspan x="16" dy="17">status &amp; instant GitHub PoC lookup.</tspan>
    </text>

    <g transform="translate(16, 132)">
      <rect width="243" height="38" rx="5" fill="#150824" stroke="#2b1242" stroke-width="0.8" />
      <text x="10" y="16" font-family="'Fira Code', monospace" font-size="9.5" fill="#94A3B8">CORE: <tspan fill="#FBBF24">EPSS • CVSS • CISA KEV</tspan></text>
      <text x="10" y="30" font-family="'Fira Code', monospace" font-size="9.5" fill="#94A3B8">STATUS: <tspan fill="#FBBF24" font-weight="bold">Extension Active</tspan></text>
    </g>
  </g>

  <!-- CARD 6: ScriptSentry -->
  <g transform="translate(620, 252)">
    <rect width="275" height="185" rx="10" fill="url(#pCardBg)" stroke="#A855F7" stroke-width="1.2" stroke-opacity="0.5" />
    
    <text x="16" y="28" font-family="'Fira Code', monospace" font-size="15" font-weight="bold" fill="#C084FC">🔍 ScriptSentry</text>
    <rect x="212" y="14" width="46" height="18" rx="4" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="0.8" />
    <text x="235" y="27" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#C084FC">JS</text>

    <text x="16" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#CBD5E1">
      <tspan x="16" dy="0">Chrome security extension monitoring</tspan>
      <tspan x="16" dy="17">all loaded JS scripts in real-time,</tspan>
      <tspan x="16" dy="17">auto-categorized by risk profile with</tspan>
      <tspan x="16" dy="17">embedded secret leak detection.</tspan>
    </text>

    <g transform="translate(16, 132)">
      <rect width="243" height="38" rx="5" fill="#150824" stroke="#2b1242" stroke-width="0.8" />
      <text x="10" y="16" font-family="'Fira Code', monospace" font-size="9.5" fill="#94A3B8">CORE: <tspan fill="#C084FC">Secret Leaks • Interceptor</tspan></text>
      <text x="10" y="30" font-family="'Fira Code', monospace" font-size="9.5" fill="#94A3B8">STATUS: <tspan fill="#C084FC" font-weight="bold">Interceptor Armed</tspan></text>
    </g>
