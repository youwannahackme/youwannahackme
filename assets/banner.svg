<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 290" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#091024" />
      <stop offset="100%" stop-color="#03050d" />
    </linearGradient>

    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9C" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00FF9C" />
    </linearGradient>

    <radialGradient id="radarBeam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#00F0FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="titleGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }

    @keyframes circuitPulse {
      0% { stroke-dashoffset: 400; opacity: 0.2; }
      50% { stroke-dashoffset: 0; opacity: 0.8; }
      100% { stroke-dashoffset: -400; opacity: 0.2; }
    }

    @keyframes beaconBlink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px #00FF9C); }
    }

    .main-title {
      font-family: 'Courier New', 'Fira Code', monospace;
      font-weight: 900;
      font-size: 40px;
      letter-spacing: 5px;
      fill: url(#neonGreenGrad);
      animation: pulseGlow 4s infinite ease-in-out;
    }

    .sub-title {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 4px;
      fill: #00F0FF;
    }

    .tag-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      fill: #94E3C9;
    }

    .radar-rotator {
      transform-origin: 825px 135px;
      animation: radarSweep 7s infinite linear;
    }

    .circuit-line {
      stroke-dasharray: 60 90;
      animation: circuitPulse 6s infinite linear;
    }

    .beacon {
      animation: beaconBlink 1.8s infinite ease-in-out;
    }
  </style>

  <!-- Frame Background -->
  <rect width="950" height="290" rx="14" fill="url(#bgGrad)" stroke="#16243d" stroke-width="1.5" />

  <!-- Cyber Grid Horizon -->
  <g opacity="0.3">
    <line x1="30" y1="195" x2="920" y2="195" stroke="#00FF9C" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="30" y1="218" x2="920" y2="218" stroke="#00FF9C" stroke-width="0.9" stroke-opacity="0.5" />
    <line x1="30" y1="245" x2="920" y2="245" stroke="#00F0FF" stroke-width="1.1" stroke-opacity="0.7" />
    <line x1="30" y1="278" x2="920" y2="278" stroke="#00F0FF" stroke-width="1.3" stroke-opacity="0.8" />
    
    <!-- Perspective lines -->
    <line x1="475" y1="180" x2="60" y2="290" stroke="#00FF9C" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="475" y1="180" x2="220" y2="290" stroke="#00FF9C" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="475" y1="180" x2="360" y2="290" stroke="#00FF9C" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="475" y1="180" x2="475" y2="290" stroke="#00FF9C" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="475" y1="180" x2="590" y2="290" stroke="#00FF9C" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="475" y1="180" x2="730" y2="290" stroke="#00FF9C" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="475" y1="180" x2="890" y2="290" stroke="#00FF9C" stroke-width="0.8" stroke-opacity="0.4" />
  </g>

  <!-- Circuit Traces -->
  <g stroke="#00F0FF" stroke-width="1.2" fill="none" opacity="0.5">
    <path class="circuit-line" d="M 40,55 L 180,55 L 215,90 L 400,90" />
    <path class="circuit-line" d="M 890,65 L 790,65 L 755,100 L 640,100" />
    <circle cx="180" cy="55" r="2.5" fill="#00FF9C" />
    <circle cx="790" cy="65" r="2.5" fill="#00F0FF" />
  </g>

  <!-- Radar HUD Scanner in Right Section -->
  <g opacity="0.85">
    <circle cx="825" cy="135" r="75" fill="none" stroke="#00F0FF" stroke-width="0.9" stroke-opacity="0.2" stroke-dasharray="4 4" />
    <circle cx="825" cy="135" r="50" fill="none" stroke="#00FF9C" stroke-width="0.9" stroke-opacity="0.3" />
    <circle cx="825" cy="135" r="20" fill="none" stroke="#00F0FF" stroke-width="0.9" stroke-opacity="0.4" />
    
    <line x1="740" y1="135" x2="910" y2="135" stroke="#00FF9C" stroke-width="0.6" stroke-opacity="0.3" />
    <line x1="825" y1="50" x2="825" y2="220" stroke="#00FF9C" stroke-width="0.6" stroke-opacity="0.3" />
    
    <!-- Rotating Sweep -->
    <g class="radar-rotator">
      <path d="M 825,135 L 890,95 A 75 75 0 0 0 825,60 Z" fill="url(#radarBeam)" />
      <line x1="825" y1="135" x2="890" y2="95" stroke="#00FF9C" stroke-width="1.2" stroke-opacity="0.7" />
    </g>

    <!-- Target Blip -->
    <circle cx="855" cy="105" r="3" fill="#00FF9C" filter="url(#softGlow)" />
    <circle cx="800" cy="160" r="2.5" fill="#FF0055">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Corner Brackets -->
  <g stroke="#00FF9C" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M 20,40 L 20,20 L 40,20" />
    <path d="M 930,40 L 930,20 L 910,20" />
    <path d="M 20,250 L 20,270 L 40,270" />
    <path d="M 930,250 L 930,270 L 910,270" />
  </g>

  <!-- Header Micro Tag -->
  <g transform="translate(50, 30)">
    <rect width="190" height="22" rx="4" fill="#0b162a" stroke="#00FF9C" stroke-width="0.9" stroke-opacity="0.5" />
    <circle cx="12" cy="11" r="3" fill="#00FF9C" class="beacon" />
    <text x="22" y="15" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700" fill="#00FF9C" letter-spacing="1">OPSEC : WEAPONIZED</text>
    
    <text x="830" text-anchor="end" y="15" font-family="'Fira Code', monospace" font-size="9.5" fill="#00F0FF" opacity="0.6" letter-spacing="1.5">SYS_REV: 4.2 // RED TEAM</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(50, 118)">
    <text class="main-title" filter="url(#titleGlow)">YOU WANNA HACK ME</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(52, 148)">
    <rect x="0" y="-12" width="5" height="15" fill="#00FF9C" />
    <text x="14" y="0" class="sub-title">WHOAMI_404 <tspan fill="#64748B">//</tspan> OFFENSIVE SECURITY &amp; TOOLING DEV</text>
  </g>

  <!-- Status HUD Pills -->
  <g transform="translate(50, 182)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="165" height="26" rx="5" fill="#091424" stroke="#00F0FF" stroke-width="0.9" stroke-opacity="0.6" />
    <circle cx="12" cy="13" r="2.5" fill="#00F0FF" />
    <text x="22" y="17" class="tag-text">RECON AUTOMATION</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="145" height="26" rx="5" fill="#091424" stroke="#00FF9C" stroke-width="0.9" stroke-opacity="0.6" />
    <circle cx="187" cy="13" r="2.5" fill="#00FF9C" />
    <text x="197" y="17" class="tag-text">GO &amp; PYTHON DEV</text>

    <!-- Pill 3 -->
    <rect x="330" y="0" width="180" height="26" rx="5" fill="#091424" stroke="#7000FF" stroke-width="0.9" stroke-opacity="0.7" />
    <circle cx="342" cy="13" r="2.5" fill="#A855F7" />
    <text x="352" y="17" class="tag-text" fill="#D8B4FE">PORTSWIGGER &amp; HTB</text>

    <!-- Pill 4 -->
    <rect x="520" y="0" width="140" height="26" rx="5" fill="#190a18" stroke="#FF0055" stroke-width="0.9" stroke-opacity="0.7" />
    <circle cx="532" cy="13" r="2.5" fill="#FF0055">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="542" y="17" class="tag-text" fill="#FF77A9">CVE HUNTING</text>
  </g>

  <!-- Bottom Telemetry Bar (Carefully spaced to prevent collisions) -->
  <g transform="translate(50, 240)">
    <rect x="0" y="0" width="850" height="24" rx="4" fill="#050a14" stroke="#18253d" stroke-width="1" />
    <circle cx="14" cy="12" r="3" fill="#00FF9C" class="beacon" />
    <text x="26" y="16" font-family="'Fira Code', monospace" font-size="9.5" fill="#00FF9C" font-weight="600">LIVE FEED:</text>
    <text x="95" y="16" font-family="'Fira Code', monospace" font-size="9.5" fill="#94A3B8">Subix [68 OSINT Sources] • URLReeper [Spidering v2] • Vulncat [Heuristics Engine]</text>
    <text x="835" text-anchor="end" y="16" font-family="'Fira Code', monospace" font-size="9.5" fill="#00F0FF" font-weight="700">STATUS: 200 OK</text>
  </g>
</svg>
