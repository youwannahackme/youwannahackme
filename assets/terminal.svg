<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c17" />
      <stop offset="100%" stop-color="#03060c" />
    </linearGradient>

    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#090f1d" />
    </linearGradient>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes pulseLed {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px #00FF9C); }
    }

    .code-font {
      font-family: 'Fira Code', 'Courier New', Consolas, monospace;
      font-size: 13px;
    }

    .cursor {
      animation: blink 1.1s infinite;
      fill: #00FF9C;
    }

    .keyword { fill: #FF7B72; font-weight: 600; }
    .defname { fill: #D2A8FF; font-weight: 600; }
    .func { fill: #79C0FF; }
    .prop { fill: #7EE787; }
    .string { fill: #A5D6FF; }
    .comment { fill: #6E7681; font-style: italic; }
    .accent { fill: #00FF9C; }
    .cyan { fill: #00F0FF; }
  </style>

  <!-- Outer Terminal Window -->
  <rect x="2" y="2" width="876" height="386" rx="10" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.5" />

  <!-- Terminal Title Bar -->
  <path d="M 3,12 A 9 9 0 0 1 12,3 L 868,3 A 9 9 0 0 1 877,12 L 877,38 L 3,38 Z" fill="url(#termHeader)" />
  <line x1="3" y1="38" x2="877" y2="38" stroke="#1b263b" stroke-width="1" />

  <!-- Window Controls -->
  <g transform="translate(18, 15)">
    <circle cx="0" cy="5" r="5" fill="#FF5F56" />
    <circle cx="16" cy="5" r="5" fill="#FFBD2E" />
    <circle cx="32" cy="5" r="5" fill="#27C93F" />
  </g>

  <!-- Session Title -->
  <g transform="translate(440, 24)" text-anchor="middle">
    <text font-family="'Fira Code', monospace" font-size="11" fill="#94A3B8" font-weight="600" letter-spacing="1">
      <tspan fill="#00FF9C">root@youwannahackme</tspan>:<tspan fill="#00F0FF">~</tspan># offsec-daemon --mode=stealth
    </text>
  </g>

  <!-- Status LED in Header -->
  <g transform="translate(830, 20)">
    <circle cx="0" cy="0" r="3.5" fill="#00FF9C" style="animation: pulseLed 2s infinite;" />
    <text x="8" y="3" font-family="'Fira Code', monospace" font-size="9" fill="#00FF9C" font-weight="600">ARMED</text>
  </g>

  <!-- Code / Execution Diagnostics -->
  <g transform="translate(28, 66)" class="code-font">
    <!-- Class Declaration -->
    <text y="0">
      <tspan class="keyword">class</tspan> <tspan class="defname">SecurityResearcher</tspan><tspan fill="#C9D1D9">:</tspan>
    </text>

    <!-- Constructor -->
    <text y="22" x="18">
      <tspan class="keyword">def</tspan> <tspan class="func">__init__</tspan><tspan fill="#C9D1D9">(self):</tspan>
    </text>

    <!-- Properties -->
    <text y="44" x="36">
      <tspan class="prop">self.focus</tspan>     <tspan fill="#C9D1D9">=</tspan> <tspan fill="#C9D1D9">[</tspan><tspan class="string">"bug bounty"</tspan><tspan fill="#C9D1D9">, </tspan><tspan class="string">"vulnerability research"</tspan><tspan fill="#C9D1D9">, </tspan><tspan class="string">"tool dev"</tspan><tspan fill="#C9D1D9">]</tspan>
    </text>

    <text y="66" x="36">
      <tspan class="prop">self.stack</tspan>     <tspan fill="#C9D1D9">=</tspan> <tspan fill="#C9D1D9">[</tspan><tspan class="string">"Go"</tspan><tspan fill="#C9D1D9">, </tspan><tspan class="string">"Python"</tspan><tspan fill="#C9D1D9">, </tspan><tspan class="string">"JavaScript/TypeScript"</tspan><tspan fill="#C9D1D9">, </tspan><tspan class="string">"Bash"</tspan><tspan fill="#C9D1D9">]</tspan>
    </text>

    <text y="88" x="36">
      <tspan class="prop">self.training</tspan>  <tspan fill="#C9D1D9">=</tspan> <tspan fill="#C9D1D9">[</tspan><tspan class="string">"PortSwigger Web Security Academy"</tspan><tspan fill="#C9D1D9">, </tspan><tspan class="string">"Hack The Box"</tspan><tspan fill="#C9D1D9">]</tspan>
    </text>

    <text y="110" x="36">
      <tspan class="prop">self.objective</tspan> <tspan fill="#C9D1D9">=</tspan> <tspan class="string">"Penetration Testing &amp; Red Team Engineering"</tspan>
    </text>

    <!-- Philosophy -->
    <text y="138" x="18">
      <tspan class="keyword">def</tspan> <tspan class="func">philosophy</tspan><tspan fill="#C9D1D9">(self):</tspan>
    </text>

    <text y="160" x="36">
      <tspan class="keyword">return</tspan> <tspan class="string">"recon first. exploit second. report always."</tspan>
    </text>

    <!-- Clean Inner Separator -->
    <line x1="0" y1="186" x2="820" y2="186" stroke="#162235" stroke-dasharray="4 4" />

    <!-- Live Execution Diagnostic Feeds -->
    <text y="210" x="0">
      <tspan class="accent">[+] STATUS:</tspan> <tspan class="cyan">security_engine.init()</tspan> <tspan class="comment"># Surface discovery active</tspan>
    </text>

    <text y="232" x="0">
      <tspan fill="#38BDF8">&gt;&gt;&gt; Subix Engine:</tspan> <tspan fill="#94A3B8">68 OSINT feeds active • Dynamic wildcard filtering ON</tspan>
    </text>

    <text y="254" x="0">
      <tspan fill="#38BDF8">&gt;&gt;&gt; URLReeper &amp; Vulncat:</tspan> <tspan fill="#94A3B8">Passive discovery + Heuristic classification ONLINE</tspan>
    </text>

    <!-- Interactive Prompt with Non-colliding Cursor -->
    <g transform="translate(0, 282)">
      <text y="14" x="0">
        <tspan class="accent">youwannahackme@offsec</tspan><tspan fill="#C9D1D9">:</tspan><tspan class="cyan">~/arsenal</tspan><tspan fill="#C9D1D9">$</tspan> <tspan fill="#E2E8F0">./hunt_vulnerabilities</tspan>
      </text>
      <!-- Cursor positioned exactly after "./hunt_vulnerabilities" with 6px margin (total width ~382px) -->
      <rect x="384" y="2" width="8" height="14" class="cursor" />
    </g>
  </g>
</svg>
