<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 36" width="100%" height="36">
  <defs>
    <linearGradient id="kamuiLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0033" stop-opacity="0" />
      <stop offset="15%" stop-color="#FF0033" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#C084FC" stop-opacity="1" />
      <stop offset="85%" stop-color="#8B5CF6" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="riftPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0033" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0" />
    </linearGradient>

    <filter id="divGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes kamuiSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseEye {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 6px #FF0033); }
    }
  </style>

  <!-- Base Kamui Spatial Rift Line -->
  <line x1="40" y1="18" x2="880" y2="18" stroke="url(#kamuiLineGrad)" stroke-width="1.6" filter="url(#divGlow)" />

  <!-- Dashed Accent Guides -->
  <line x1="100" y1="12" x2="390" y2="12" stroke="#FF0033" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.45" />
  <line x1="530" y1="12" x2="820" y2="12" stroke="#8B5CF6" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.45" />

  <!-- Animated High-Speed Kamui Laser Streak -->
  <g>
    <rect x="0" y="16.5" width="140" height="3" fill="url(#riftPulse)" filter="url(#divGlow)">
      <animateTransform attributeName="transform" type="translate" values="-180,0; 940,0" dur="3.2s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Central Mangekyō Sharingan / Kamui Vortex Node -->
  <g transform="translate(460, 18)">
    <!-- Outer Rinnegan Ripple Ring -->
    <circle cx="0" cy="0" r="14" fill="#06040b" stroke="#8B5CF6" stroke-width="1.4" filter="url(#divGlow)" />
    <circle cx="0" cy="0" r="10" fill="#12050c" stroke="#FF0033" stroke-width="1" />
    
    <!-- Rotating 3-Blade Mangekyo Pinwheel -->
    <g style="transform-origin: 0px 0px; animation: kamuiSpin 6s infinite linear;">
      <!-- Pupil Core -->
      <circle cx="0" cy="0" r="3.2" fill="#000000" />
      <!-- Blade 1 -->
      <path d="M 0,0 C 2,-5 8,-8 7,-10 C 3,-9 1,-4 0,0 Z" fill="#000000" />
      <!-- Blade 2 (Rotated 120) -->
      <path d="M 0,0 C 5,2 8,8 10,7 C 9,3 4,1 0,0 Z" fill="#000000" transform="rotate(120)" />
      <!-- Blade 3 (Rotated 240) -->
      <path d="M 0,0 C -5,2 -8,8 -7,10 C -3,9 -1,4 0,0 Z" fill="#000000" transform="rotate(240)" />
    </g>

    <!-- Center Crimson Pupil Spark -->
    <circle cx="0" cy="0" r="1.5" fill="#FF0033" style="animation: pulseEye 2s infinite;" />
  </g>

  <!-- Flanking Diamond Magatama Nodes -->
  <polygon points="415,18 422,14 429,18 422,22" fill="#06040b" stroke="#FF0033" stroke-width="1.2" />
  <circle cx="422" cy="18" r="1.5" fill="#FF0033" />

  <polygon points="491,18 498,14 505,18 498,22" fill="#06040b" stroke="#8B5CF6" stroke-width="1.2" />
  <circle cx="498" cy="18" r="1.5" fill="#8B5CF6" />

  <!-- Left / Right Terminal Endpoint Dots -->
  <circle cx="40" cy="18" r="3" fill="#FF0033" />
  <circle cx="880" cy="18" r="3" fill="#8B5CF6" />
</svg>