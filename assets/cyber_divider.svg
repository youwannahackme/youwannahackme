<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 30" width="100%" height="30">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0" />
      <stop offset="15%" stop-color="#00FF9C" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="85%" stop-color="#7000FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="laserPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <filter id="divGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes laserRun {
      0% { transform: translateX(-400px); }
      100% { transform: translateX(900px); }
    }
    @keyframes rotateNode {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Base Circuit Track -->
  <line x1="50" y1="15" x2="850" y2="15" stroke="url(#dividerGrad)" stroke-width="1.5" filter="url(#divGlow)" />
  
  <!-- Dashed Accent Guides -->
  <line x1="120" y1="9" x2="380" y2="9" stroke="#00FF9C" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.4" />
  <line x1="520" y1="9" x2="780" y2="9" stroke="#00F0FF" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.4" />

  <!-- Animated High-Speed Laser Pulse -->
  <g>
    <rect x="0" y="13.5" width="120" height="3" fill="url(#laserPulse)" filter="url(#divGlow)">
      <animateTransform attributeName="transform" type="translate" values="-150,0; 950,0" dur="3s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Central Sci-Fi HUD Diamond Node -->
  <g transform="translate(450, 15)">
    <polygon points="0,-9 9,0 0,9 -9,0" fill="#050a14" stroke="#00FF9C" stroke-width="1.5" filter="url(#divGlow)" />
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#00F0FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- Left / Right Terminal Endpoint Dots -->
  <circle cx="50" cy="15" r="3" fill="#00FF9C" />
  <circle cx="850" cy="15" r="3" fill="#7000FF" />
</svg>
