<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 140" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050814" stop-opacity="0" />
      <stop offset="60%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#04060e" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9C" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <filter id="fGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes waveMotion {
      0% { d: path("M 0,60 Q 237.5,30 475,60 T 950,60 L 950,140 L 0,140 Z"); }
      50% { d: path("M 0,60 Q 237.5,90 475,60 T 950,60 L 950,140 L 0,140 Z"); }
      100% { d: path("M 0,60 Q 237.5,30 475,60 T 950,60 L 950,140 L 0,140 Z"); }
    }
    @keyframes waveMotion2 {
      0% { d: path("M 0,75 Q 237.5,100 475,75 T 950,75 L 950,140 L 0,140 Z"); }
      50% { d: path("M 0,75 Q 237.5,50 475,75 T 950,75 L 950,140 L 0,140 Z"); }
      100% { d: path("M 0,75 Q 237.5,100 475,75 T 950,75 L 950,140 L 0,140 Z"); }
    }
  </style>

  <!-- Base Grid Lines -->
  <g stroke="#1a2b4c" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="30" x2="950" y2="30" />
    <line x1="0" y1="50" x2="950" y2="50" />
    <line x1="0" y1="70" x2="950" y2="70" />
    <line x1="0" y1="90" x2="950" y2="90" />
  </g>

  <!-- Animated Wave Layer 1 -->
  <path fill="#0d1f3c" fill-opacity="0.5" stroke="url(#waveGrad)" stroke-width="1.5" style="animation: waveMotion 8s infinite ease-in-out;" />

  <!-- Animated Wave Layer 2 -->
  <path fill="#071020" fill-opacity="0.8" stroke="#00FF9C" stroke-width="1" stroke-opacity="0.6" style="animation: waveMotion2 6s infinite ease-in-out;" />

  <!-- Center Sign-Off HUD Capsule -->
  <g transform="translate(475, 95)" text-anchor="middle">
    <!-- Capsule background -->
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#050a14" stroke="#00F0FF" stroke-width="1.2" filter="url(#fGlow)" />
    
    <circle cx="-215" cy="0" r="4" fill="#00FF9C">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" />
    </circle>
    
    <text y="4" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="2">
      MISSION: <tspan fill="#00FF9C">SECURE</tspan> • RECON FIRST • EXPLOIT SECOND • REPORT ALWAYS
    </text>

    <circle cx="215" cy="0" r="4" fill="#7000FF" />
  </g>
</svg>
