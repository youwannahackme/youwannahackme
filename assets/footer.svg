<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 120" width="950" height="120">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0033" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <filter id="fGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes waveMotion {
      0% { d: path("M 0,50 Q 237.5,25 475,50 T 950,50 L 950,120 L 0,120 Z"); }
      50% { d: path("M 0,50 Q 237.5,75 475,50 T 950,50 L 950,120 L 0,120 Z"); }
      100% { d: path("M 0,50 Q 237.5,25 475,50 T 950,50 L 950,120 L 0,120 Z"); }
    }
    @keyframes waveMotion2 {
      0% { d: path("M 0,65 Q 237.5,85 475,65 T 950,65 L 950,120 L 0,120 Z"); }
      50% { d: path("M 0,65 Q 237.5,45 475,65 T 950,65 L 950,120 L 0,120 Z"); }
      100% { d: path("M 0,65 Q 237.5,85 475,65 T 950,65 L 950,120 L 0,120 Z"); }
    }
  </style>

  <!-- Ambient Grid Lines -->
  <g stroke="#261033" stroke-width="0.7" opacity="0.35">
    <line x1="0" y1="20" x2="950" y2="20" />
    <line x1="0" y1="40" x2="950" y2="40" />
    <line x1="0" y1="60" x2="950" y2="60" />
  </g>

  <!-- Animated Kamui Void Waves -->
  <path d="M 0,50 Q 237.5,35 475,50 T 950,50 L 950,120 L 0,120 Z" fill="#150624" fill-opacity="0.45" stroke="url(#waveGrad)" stroke-width="1.2" style="animation: waveMotion 9s infinite ease-in-out;" />
  <path d="M 0,65 Q 237.5,75 475,65 T 950,65 L 950,120 L 0,120 Z" fill="#06020c" fill-opacity="0.9" stroke="#FF0033" stroke-width="0.9" stroke-opacity="0.5" style="animation: waveMotion2 7s infinite ease-in-out;" />

  <!-- Center Sign-Off HUD Capsule -->
  <g transform="translate(475, 78)">
    <!-- Outer Pill Container: 700px width centered at 0 -->
    <rect x="-350" y="-17" width="700" height="34" rx="17" fill="#0c0417" stroke="#A855F7" stroke-width="1.2" filter="url(#fGlow)" />
    
    <!-- Left Indicator Beacon (Sharingan Red) -->
    <circle cx="-322" cy="0" r="3.5" fill="#FF0033">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite" />
    </circle>
    
    <!-- Main Footer Mission Text Split for Zero Overlap -->
    <g font-family="'Fira Code', 'Courier New', monospace" font-size="10.5" font-weight="bold" letter-spacing="1.2">
      <text x="-215" y="4" text-anchor="end" fill="#FF0033">NINJA WAY:</text>
      <text x="-205" y="4" text-anchor="start" fill="#CBD5E1">RECON FIRST • EXPLOIT SECOND • INFINITE TSUKUYOMI ALWAYS</text>
    </g>

    <!-- Right Indicator Beacon (Rinnegan Purple) -->
    <circle cx="322" cy="0" r="3.5" fill="#A855F7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite" begin="0.8s" />
    </circle>
  </g>
</svg>