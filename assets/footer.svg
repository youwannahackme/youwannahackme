<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 120" width="100%" height="100%">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9C" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <filter id="fGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes waveMotion {
      0% { d: path("M 0,50 Q 237.5,25 475,50 T 950,50 L 950,120 L 0,120 Z"); }
      50% { d: path("M 0,50 Q 237.5,75 475,50 T 950,50 L 950,120 L 0,120 Z"); }
      100% { d: path("M 0,50 Q 237.5,25 475,50 T 950,50 L 950,120 L 0,120 Z"); }
    }
    @keyframes waveMotion2 {
      0% { d: path("M 0,65 Q 237.5,85 475,65 T 950,65 L 950,120 L 0,120 Z"); }
      50% { d: path("M 0,65 Q 237.5,45 475,65 T 950,65 L 950,120 L 0,120 Z"); }
      100% { d: path("M 0,65 Q 237.5,85 475,65 T 950,65 L 950,120 L 0,120 Z"); }
    }
  </style>

  <!-- Ambient Grid Lines -->
  <g stroke="#1a2b4c" stroke-width="0.7" opacity="0.3">
    <line x1="0" y1="20" x2="950" y2="20" />
    <line x1="0" y1="40" x2="950" y2="40" />
    <line x1="0" y1="60" x2="950" y2="60" />
  </g>

  <!-- Animated Cyber Waves -->
  <path fill="#0d1f3c" fill-opacity="0.4" stroke="url(#waveGrad)" stroke-width="1.2" style="animation: waveMotion 9s infinite ease-in-out;" />
  <path fill="#050a14" fill-opacity="0.9" stroke="#00FF9C" stroke-width="0.8" stroke-opacity="0.5" style="animation: waveMotion2 7s infinite ease-in-out;" />

  <!-- Center Sign-Off HUD Capsule (Engineered with ample margin to prevent text collision) -->
  <g transform="translate(475, 78)" text-anchor="middle">
    <!-- Outer Pill Container: 660px width for spacious typography -->
    <rect x="-330" y="-17" width="660" height="34" rx="17" fill="#070d1a" stroke="#00F0FF" stroke-width="1.2" filter="url(#fGlow)" />
    
    <!-- Left Indicator Beacon -->
    <circle cx="-302" cy="0" r="3.5" fill="#00FF9C">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite" />
    </circle>
    
    <!-- Main Footer Mission Text -->
    <text y="4" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="600" fill="#CBD5E1" letter-spacing="1.2">
      <tspan fill="#00FF9C">MISSION:</tspan> SECURE // RECON FIRST • EXPLOIT SECOND • REPORT ALWAYS
    </text>

    <!-- Right Indicator Beacon -->
    <circle cx="302" cy="0" r="3.5" fill="#7000FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite" begin="0.8s" />
    </circle>
  </g>
</svg>
